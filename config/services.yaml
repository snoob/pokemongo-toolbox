# Le découpage DDD de GUIDELINES.md §5 se reflète ici : le conteneur ne connaît que
# des services, jamais le modèle. Les ports (§6) sont aliasés sur leur adapter.
parameters:
    pogo.data_dir: '%kernel.project_dir%/data'
    # Sits beside the container cache rather than under it, so `cache:clear` does not
    # throw away the rankings — and so it stays writable inside a read-only PHAR.
    pogo.cache_dir: '%kernel.cache_dir%/../pogo'
    # Les classements bougent à chaque mise à jour du méta, pas à chaque heure.
    pogo.rankings_ttl: 86400
    # La météo du jeu suit la prévision horaire : au-delà d'une demi-heure elle a pu bouger.
    pogo.forecast_ttl: 1800
    # Une ville ne déménage pas.
    pogo.places_ttl: 2592000
    # L'IP change quand l'ordinateur change de réseau.
    pogo.ip_location_ttl: 3600
    # Langues embarquées : un nom tapé dans l'une ou l'autre doit résoudre (§6).
    pogo.locales: ['fr', 'en']

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        # No trailing slash: under the phar:// stream a prefix ending in "/" makes
        # Symfony's GlobResource yield nothing, and the whole application registers
        # zero services without a word of warning.
        resource: '%kernel.project_dir%/src'
        exclude:
            - '%kernel.project_dir%/src/Kernel.php'
            # Le domaine n'est pas un sac à services : modèle, ports et exceptions
            # ne sont jamais instanciés par le conteneur.
            - '%kernel.project_dir%/src/Domain/*/Model/'
            - '%kernel.project_dir%/src/Domain/*/Port/'
            - '%kernel.project_dir%/src/Domain/*/Exception/'
            # Query, Result et Outcome sont des messages, pas des services.
            - '%kernel.project_dir%/src/Application/*/*/*Query.php'
            - '%kernel.project_dir%/src/Application/*/*/*Result.php'
            - '%kernel.project_dir%/src/Application/*/*/*Outcome.php'
            - '%kernel.project_dir%/src/Infrastructure/Json/JsonFetchFailed.php'

    # --- Ports → adapters -------------------------------------------------------

    App\Domain\Pokemon\Port\SpeciesCatalog: '@App\Infrastructure\Catalog\JsonFileSpeciesCatalog'
    App\Domain\Pvp\Port\CpMultiplierTable: '@App\Infrastructure\Cpm\JsonFileCpMultiplierTable'
    App\Domain\Pvp\Port\MegaLevelTable: '@App\Infrastructure\Cpm\JsonFileMegaLevelTable'
    App\Domain\Pokemon\Port\MoveCatalog: '@App\Infrastructure\Catalog\JsonFileMoveCatalog'
    App\Domain\Pvp\Port\PvpRankingCatalog: '@App\Infrastructure\Pvpoke\PvpokeRankingCatalog'
    App\Domain\Encounter\Port\WeatherBoostTable: '@App\Infrastructure\Encounter\JsonFileWeatherBoostTable'
    App\Domain\Weather\Port\WeatherForecast: '@App\Infrastructure\OpenMeteo\OpenMeteoForecast'
    App\Domain\Weather\Port\PlaceSearch: '@App\Infrastructure\OpenMeteo\OpenMeteoPlaceSearch'
    App\Domain\Weather\Port\PlaceLocator: '@App\Infrastructure\Ipinfo\IpinfoPlaceLocator'
    # Le dumper XLIFF est fourni par FrameworkBundle : on l'alias plutôt que d'écrire
    # un générateur XML maison (§8).
    Symfony\Component\Translation\Dumper\XliffFileDumper: '@translation.dumper.xliff'

    # Le cache décore le fournisseur JSON : les adapters ignorent qu'il existe.
    App\Infrastructure\Json\JsonFetcher: '@App\Infrastructure\Json\CachedJsonFetcher'

    App\Infrastructure\Json\CachedJsonFetcher:
        arguments:
            $inner: '@App\Infrastructure\Json\HttpJsonFetcher'
            $cacheDirectory: '%pogo.cache_dir%'
            $ttlSeconds: '%pogo.rankings_ttl%'

    # Même décorateur, autres durées de vie : chaque source a son rythme.
    pogo.json.forecasts:
        class: App\Infrastructure\Json\CachedJsonFetcher
        arguments:
            $inner: '@App\Infrastructure\Json\HttpJsonFetcher'
            $cacheDirectory: '%pogo.cache_dir%'
            $ttlSeconds: '%pogo.forecast_ttl%'

    pogo.json.places:
        class: App\Infrastructure\Json\CachedJsonFetcher
        arguments:
            $inner: '@App\Infrastructure\Json\HttpJsonFetcher'
            $cacheDirectory: '%pogo.cache_dir%'
            $ttlSeconds: '%pogo.places_ttl%'

    pogo.json.ip_location:
        class: App\Infrastructure\Json\CachedJsonFetcher
        arguments:
            $inner: '@App\Infrastructure\Json\HttpJsonFetcher'
            $cacheDirectory: '%pogo.cache_dir%'
            $ttlSeconds: '%pogo.ip_location_ttl%'

    App\Infrastructure\OpenMeteo\OpenMeteoForecast:
        arguments:
            $fetcher: '@pogo.json.forecasts'

    App\Infrastructure\OpenMeteo\OpenMeteoPlaceSearch:
        arguments:
            $fetcher: '@pogo.json.places'

    App\Infrastructure\Ipinfo\IpinfoPlaceLocator:
        arguments:
            $fetcher: '@pogo.json.ip_location'

    App\Infrastructure\Encounter\JsonFileWeatherBoostTable:
        arguments:
            $file: '%pogo.data_dir%/weather.json'

    App\Infrastructure\Catalog\SpeciesFileReader:
        arguments:
            $file: '%pogo.data_dir%/species.json'

    App\Infrastructure\Naming\LocalisedSpeciesNames:
        arguments:
            $locales: '%pogo.locales%'

    App\Infrastructure\Naming\InputLocale:
        arguments:
            $locales: '%pogo.locales%'
            $default: '%kernel.default_locale%'

    App\Infrastructure\Cpm\JsonFileCpMultiplierTable:
        arguments:
            $file: '%pogo.data_dir%/cpm.json'

    App\Infrastructure\Cpm\JsonFileMegaLevelTable:
        arguments:
            $file: '%pogo.data_dir%/mega-levels.json'

    App\Infrastructure\Catalog\JsonFileMoveCatalog:
        arguments:
            $file: '%pogo.data_dir%/moves.json'

    App\Infrastructure\Build\GameDataPaths:
        arguments:
            $species: '%pogo.data_dir%/species.json'
            $cpMultipliers: '%pogo.data_dir%/cpm.json'
            $megaLevels: '%pogo.data_dir%/mega-levels.json'
            $moves: '%pogo.data_dir%/moves.json'
            $weather: '%pogo.data_dir%/weather.json'
            $translations: '%kernel.project_dir%/translations'
