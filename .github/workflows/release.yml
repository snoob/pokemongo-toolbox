name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # A release must not ship a binary the checks would have rejected, so the build waits
  # on this job. The steps live in `ci.yml` and are run from there, never copied.
  quality:
    uses: ./.github/workflows/ci.yml

  phar:
    name: Build and publish the PHAR
    needs: quality
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          ini-values: phar.readonly=0
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      # The released binary ships the game data as it stands on release day, not as it
      # stood when the files were last committed.
      - name: Refresh the game data
        run: bin/console app:data:build

      - name: Download Box
        run: |
          curl -fsSL -o box.phar \
            "https://github.com/box-project/box/releases/download/${BOX_VERSION}/box.phar"
          chmod +x box.phar
        env:
          BOX_VERSION: 4.7.0

      - name: Build the PHAR
        run: ./box.phar compile --no-interaction

      # The only check that sees the data refreshed above: it runs the built binary.
      - name: Check that it runs
        run: ./build/pogo.phar pvp gengar --league=great --no-ansi

      - name: Checksum
        run: cd build && sha256sum pogo.phar > pogo.phar.sha256

      # The release note is the annotated tag's message: written with the tag, published as is.
      # actions/checkout fetches the tag without its annotation, so it is fetched again first;
      # otherwise --notes-from-tag falls back to the commit message.
      - name: Publish the release
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" build/pogo.phar build/pogo.phar.sha256 --notes-from-tag
        env:
          GH_TOKEN: ${{ github.token }}
